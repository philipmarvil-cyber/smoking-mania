name: Fix catalog sync button
on:
  push:
    branches: [main]
    paths:
      - '_patch_catalog_sync.py'
      - '.github/workflows/fix-catalog-sync.yml'

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply sync fix
        run: python3 _patch_catalog_sync.py
      - name: Validate server JavaScript
        run: |
          node --check api/_catalog-lib.js
          node --check api/sync-catalog.js
      - name: Validate admin inline JavaScript
        run: |
          python3 - <<'PY'
          import re
          from pathlib import Path
          html = Path('admin.html').read_text(encoding='utf-8')
          blocks = re.findall(r'<script(?:\s[^>]*)?>(.*?)</script>', html, flags=re.S|re.I)
          for i, block in enumerate(blocks):
              Path(f'/tmp/admin-inline-{i}.js').write_text(block, encoding='utf-8')
          print(len(blocks))
          PY
          for f in /tmp/admin-inline-*.js; do node --check "$f"; done
      - name: Commit clean result
        run: |
          rm -f _patch_catalog_sync.py .github/workflows/fix-catalog-sync.yml
          git config user.name "philipmarvil-cyber"
          git config user.email "philipmarvil@gmail.com"
          git add -A
          git diff --cached --quiet && exit 0
          git commit -m "Make admin catalog sync fast and reliable"
          git push
