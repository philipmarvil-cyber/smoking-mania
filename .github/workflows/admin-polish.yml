name: Admin waitlist and banner polish

on:
  push:
    branches: [main]
    paths:
      - 'scripts/admin-polish.py'
      - '.github/workflows/admin-polish.yml'

permissions:
  contents: write

jobs:
  polish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Apply patch
        run: python scripts/admin-polish.py
      - name: Validate JavaScript
        run: |
          node --check api/_user-lib.js
          node --check api/notify-log.js
          node --check api/banners.js
          node --check admin-enhancements.js
          node --check admin-banner-tools.js
          node --check home-banners.js
      - name: Commit clean result
        run: |
          rm -f scripts/admin-polish.py .github/workflows/admin-polish.yml
          git config user.name "philipmarvil-cyber"
          git config user.email "philipmarvil@gmail.com"
          git add -A
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Improve admin waits and banner editor"
          git push origin main
