name: Banner targets
on:
  push:
    paths:
      - 'admin-banner-targets.js'
      - 'home-banners.js'
      - 'api/banners.js'
      - '.github/workflows/banner-targets.yml'
permissions:
  contents: write
jobs:
  integrate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate JavaScript
        run: |
          node --check admin-banner-targets.js
          node --check home-banners.js
          node --check api/banners.js
      - name: Connect targeting scripts
        run: |
          python - <<'PY'
          from pathlib import Path

          index = Path('index.html')
          text = index.read_text(encoding='utf-8')
          old = '<script src="/home-banners.js?v=20260817c"></script>'
          new = '<script src="/home-banners.js?v=20260817d"></script>'
          if old in text:
              text = text.replace(old, new, 1)
          elif new not in text:
              raise SystemExit('home-banners script tag not found')
          index.write_text(text, encoding='utf-8')

          admin = Path('admin.html')
          text = admin.read_text(encoding='utf-8')
          anchor = '    <script src="/admin-banner-tools.js?v=20260817a"></script>'
          addition = anchor + '\n    <script src="/admin-banner-targets.js?v=20260817a"></script>'
          if 'admin-banner-targets.js' not in text:
              if anchor not in text:
                  raise SystemExit('admin banner tools script tag not found')
              text = text.replace(anchor, addition, 1)
          admin.write_text(text, encoding='utf-8')
          PY
          git diff --check
      - name: Commit clean result
        run: |
          rm -f .github/workflows/banner-targets.yml
          git config user.name "philipmarvil-cyber"
          git config user.email "philipmarvil@gmail.com"
          git add -A
          git diff --cached --quiet && exit 0
          git commit -m "Connect internal banner targets"
          git push