# final retry: index.html intentionally keeps legacy CRLF
name: Finalize sharp cached card images

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/finalize-image-cdn.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Patch product grid image delivery
        shell: bash
        run: |
          python .github/scripts/patch_images.py
          node --check card-quality.js
          node --check favorites-waitlist.js
          grep -q 'CARD_IMAGE_WIDTH = 640' card-quality.js
          grep -q 'card-quality.js?v=20260911cdn1' index.html

      - name: Commit optimized delivery
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rm .github/workflows/finalize-image-cdn.yml .github/scripts/patch_images.py
          git add card-quality.js favorites-waitlist.js index.html
          git commit -m 'Use sharp cached CDN images in product grids'
          git push origin HEAD:main
