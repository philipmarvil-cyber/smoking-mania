name: Apply sharp-first product images

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/sharp-first-images.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Switch product cards to sharp-first images
        shell: bash
        env:
          SHARP_BLOCK_B64: ""
        run: |
          python - <<'PY'
          import base64, os
          from pathlib import Path
          card = Path('card-quality.js')
          s = card.read_text(encoding='utf-8')
          start_marker = '    // Instant-first: miniature никогда не убираем, пока резкая CDN-картинка\n'
          end_marker = '    // Дополнительный раздел «Список ожидания» внутри избранного. Загружаем\n'
          start = s.index(start_marker)
          end = s.index(end_marker, start)
          replacement = base64.b64decode(os.environ['SHARP_BLOCK_B64']).decode('utf-8')
          card.write_text(s[:start] + replacement + s[end:], encoding='utf-8')

          index = Path('index.html')
          b = index.read_bytes()
          old = b'/card-quality.js?v=20260911instant3'
          new = b'/card-quality.js?v=20260911sharp1'
          if old not in b:
              raise SystemExit('card-quality loader version not found')
          index.write_bytes(b.replace(old, new, 1))
          PY

          node --check card-quality.js
          grep -q 'CARD_IMAGE_QUALITY = 88' card-quality.js
          grep -q '20260911sharp1' index.html

      - name: Commit sharp-first image pipeline
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rm .github/workflows/sharp-first-images.yml
          git add card-quality.js index.html
          git commit -m 'Show sharp product images without blurry fallback'
          git push origin HEAD:main
