name: Admin users upgrade

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/admin-users-upgrade.yml'

permissions:
  contents: write

jobs:
  upgrade:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Apply focused patch
        run: python scripts/apply-admin-users-upgrade.py

      - name: Validate JavaScript
        run: |
          node --check api/_user-lib.js
          node --check api/orders.js
          node --check api/create-order.js
          node --check api/notify-log.js
          node --check storefront-enhancements.js
          node --check admin-enhancements.js
          grep -q '/admin-enhancements.js?v=20260817a' admin.html

      - name: Commit clean result
        run: |
          rm -f .github/workflows/admin-users-upgrade.yml scripts/apply-admin-users-upgrade.py
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Add admin customer profiles and purchase history"
          git push
