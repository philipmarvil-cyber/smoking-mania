name: Apply mobile sharp image prefetch

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/mobile-sharp-prefetch.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Tune sharp image loading
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          card = Path('card-quality.js')
          s = card.read_text(encoding='utf-8')
          s = s.replace('    const CARD_IMAGE_QUALITY = 88;\n', '    const CARD_IMAGE_QUALITY = 82;\n', 1)
          s = s.replace('    const SHARP_EAGER_COUNT = isMobileWebView ? 8 : 10;\n', '    const SHARP_EAGER_COUNT = isMobileWebView ? 4 : 8;\n', 1)
          s = s.replace("    const SHARP_PREFETCH_MARGIN = isMobileWebView ? '700px 0px' : '1000px 0px';\n", "    const SHARP_PREFETCH_MARGIN = isMobileWebView ? '420px 0px' : '800px 0px';\n", 1)

          anchor = '    function getCardIndexFromContainer(container) {\n'
          preload_code = (
              "    // На мобильном начинаем те же первые sharp-запросы уже при касании по бренду.\n"
              "    // Когда карточки появятся после клика, браузер переиспользует активные запросы.\n"
              "    const sharpTapPreloads = new Map();\n"
              "    const sharpTapFolders = new Set();\n\n"
              "    function prewarmTappedCategory(folderId) {\n"
              "        const key = String(folderId || '');\n"
              "        if (!key || sharpTapFolders.has(key)) return;\n"
              "        if (typeof allProducts === 'undefined' || !Array.isArray(allProducts)) return;\n"
              "        const products = allProducts\n"
              "            .filter(prod => String(prod.folderId || '') === key && getSharpCardUrl(prod))\n"
              "            .sort((a, b) => Number(!!a.outOfStock) - Number(!!b.outOfStock))\n"
              "            .slice(0, 4);\n"
              "        if (!products.length) return;\n"
              "        sharpTapFolders.add(key);\n"
              "        products.forEach(prod => {\n"
              "            const url = getSharpCardUrl(prod);\n"
              "            if (!url || sharpTapPreloads.has(url)) return;\n"
              "            const preload = new Image();\n"
              "            preload.decoding = 'async';\n"
              "            try { preload.fetchPriority = 'high'; } catch (e) {}\n"
              "            preload.setAttribute('fetchpriority', 'high');\n"
              "            sharpTapPreloads.set(url, preload);\n"
              "            const cleanup = () => setTimeout(() => sharpTapPreloads.delete(url), 30000);\n"
              "            preload.addEventListener('load', cleanup, { once: true });\n"
              "            preload.addEventListener('error', cleanup, { once: true });\n"
              "            preload.src = url;\n"
              "        });\n"
              "    }\n\n"
              "    if (isMobileWebView) {\n"
              "        document.addEventListener('pointerdown', event => {\n"
              "            const target = event.target instanceof Element ? event.target : null;\n"
              "            const chip = target?.closest('#page-category .subcat-logo-card');\n"
              "            const folderId = String(chip?.dataset?.categoryLogoId || '');\n"
              "            if (folderId) prewarmTappedCategory(folderId);\n"
              "        }, { capture: true, passive: true });\n"
              "    }\n\n"
          )
          if 'const sharpTapPreloads = new Map();' not in s:
              if anchor not in s:
                  raise SystemExit('card index anchor not found')
              s = s.replace(anchor, preload_code + anchor, 1)

          card.write_text(s, encoding='utf-8')
          PY

          node --check card-quality.js
          grep -q 'CARD_IMAGE_QUALITY = 82' card-quality.js
          grep -q 'SHARP_EAGER_COUNT = isMobileWebView ? 4' card-quality.js
          grep -q 'prewarmTappedCategory' card-quality.js

      - name: Commit mobile sharp loading fix
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rm .github/workflows/mobile-sharp-prefetch.yml
          git add card-quality.js
          git commit -m 'Start sharp product images earlier on mobile'
          git push origin HEAD:main
