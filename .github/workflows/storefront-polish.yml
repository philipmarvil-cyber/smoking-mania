name: Storefront polish

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/storefront-polish.yml'

permissions:
  contents: write

jobs:
  polish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Apply patch
        run: python scripts/storefront-polish.py
      - name: Validate JavaScript
        run: |
          node --check smart-search.js
          node --check storefront-enhancements.js
          node --input-type=module --check < api/_catalog-lib.js
          node --input-type=module --check < api/get-data.js
          node --input-type=module --check < api/product-image.js
          git diff --check
      - name: Commit result
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rm .github/workflows/storefront-polish.yml scripts/storefront-polish.py
          git add index.html smart-search.js api/_catalog-lib.js
          git commit -m 'Finish storefront performance and gallery polish'
          git push origin HEAD:main
