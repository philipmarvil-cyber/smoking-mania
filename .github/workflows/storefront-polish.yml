name: Storefront polish

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/storefront-polish.yml'

permissions:
  contents: write

jobs:
  polish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Patch large storefront files
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          # smart-search.js: freshness ordering belongs only to New items.
          p = Path('smart-search.js')
          s = p.read_text(encoding='utf-8')
          start_marker = '    // applyCatalog intentionally keeps the storefront object compact'
          end_marker = '    const originalRenderProductCardsInto ='
          if start_marker in s:
              start = s.index(start_marker)
              end = s.index(end_marker, start)
              s = s[:start] + s[end:]

          old_sort = """            const categorySearchActive = id === 'category-products-container' &&
                !!document.getElementById('category-search-input')?.value?.trim();
            const shouldSortFresh = id === 'home-newest-container' ||
                id === 'newest-products-container' ||
                (id === 'category-products-container' && !categorySearchActive);
"""
          new_sort = """            const shouldSortFresh = id === 'home-newest-container' ||
                id === 'newest-products-container';
"""
          if old_sort in s:
              s = s.replace(old_sort, new_sort, 1)
          elif "(id === 'category-products-container' && !categorySearchActive)" in s:
              raise SystemExit('smart-search freshness patch failed')
          p.write_text(s, encoding='utf-8')

          # api/_catalog-lib.js: keep all image metadata in the scheduled sync,
          # so ordinary browsing does not create metadata calls to MoySklad.
          p = Path('api/_catalog-lib.js')
          s = p.read_text(encoding='utf-8')
          old = """        const imageRow = product.images?.rows?.[0];
        const hasPhoto = !!imageRow;
        const miniHref = hasPhoto ? (imageRow.miniature?.downloadHref || '') : '';
"""
          new = """        const imageRows = product.images?.rows || [];
        const imageCount = Number(product.images?.meta?.size) || imageRows.length;
        const miniHrefs = imageRows
            .map(row => row?.miniature?.downloadHref || '')
            .filter(Boolean);
        const hasPhoto = miniHrefs.length > 0;
        const miniHref = hasPhoto ? miniHrefs[0] : '';
"""
          if old in s:
              s = s.replace(old, new, 1)
          elif 'const imageCount = Number(product.images?.meta?.size)' not in s:
              raise SystemExit('catalog image block patch failed')

          s = s.replace(
              'if (hasPhoto) imageHrefs[product.id] = miniHref;',
              'if (hasPhoto) imageHrefs[product.id] = { mini: miniHref, minis: miniHrefs };',
              1
          )
          old = 'const imgVer = shortHash(miniHref);'
          new = "const imgVer = shortHash([product.updated || '', imageCount, ...miniHrefs].join('|'));"
          if old in s:
              s = s.replace(old, new, 1)
          elif new not in s:
              raise SystemExit('catalog image version patch failed')

          old = """            img: hasPhoto ? `/api/product-image?id=${product.id}&v=${imgVer}` : '',
            description: product.description || '',
"""
          new = """            img: hasPhoto ? `/api/product-image?id=${product.id}&v=${imgVer}` : '',
            imageCount: hasPhoto ? Math.max(1, imageCount) : 0,
            imageVersion: imgVer,
            description: product.description || '',
"""
          if old in s:
              s = s.replace(old, new, 1)
          elif 'imageVersion: imgVer' not in s:
              raise SystemExit('catalog return image fields patch failed')
          p.write_text(s, encoding='utf-8')

          # index.html: preserve metadata, avoid downloading full-size photos for
          # every grid card, parallelize catalog vs Telegram CloudStorage, connect gallery.
          p = Path('index.html')
          s = p.read_text(encoding='utf-8')
          old = """                folderId: prod.folderId || null,
                isNew: !!prod.isNew,
                stock: (typeof prod.stock === 'number') ? prod.stock : null // null = учёт остатков выключен в МойСклад — лимита нет
"""
          new = """                folderId: prod.folderId || null,
                isNew: !!prod.isNew,
                firstSeenAt: Number(prod.firstSeenAt) || 0,
                imageCount: Number(prod.imageCount) || (prod.img ? 1 : 0),
                imageVersion: prod.imageVersion || '0',
                stock: (typeof prod.stock === 'number') ? prod.stock : null // null = учёт остатков выключен в МойСклад — лимита нет
"""
          if old in s:
              s = s.replace(old, new, 1)
          elif 'imageCount: Number(prod.imageCount)' not in s:
              raise SystemExit('index catalog fields patch failed')

          old = 'const imgHtml = prod.img ? `<img src="${prod.img}" data-full-src="${prod.img}&size=full" loading="lazy" decoding="async">` : `<span class="no-photo">Тут скоро будет фото</span>`;'
          new = 'const imgHtml = prod.img ? `<img src="${prod.img}" loading="lazy" decoding="async">` : `<span class="no-photo">Тут скоро будет фото</span>`;'
          if old in s:
              s = s.replace(old, new, 1)
          elif new not in s:
              raise SystemExit('grid image patch failed')

          old = """        loadCartAndFavorites(() => {
            loadShopData();
        });
"""
          new = """        // Не ждём два сетевых чтения Telegram CloudStorage перед каталогом.
        // Товары и пользовательские данные стартуют параллельно.
        loadShopData();
        loadCartAndFavorites(() => {
            if (allProducts.length || categories.length) renderScreen(currentScreen());
        });

        // Живые остатки обновляем уже после первого рендера. Серверный cooldown
        // по-прежнему ограничивает реальный запрос к МойСклад разом в 3 минуты.
        setTimeout(() => {
            fetch('/api/get-data?refresh=1', { cache: 'no-store' })
                .then(r => r.json())
                .then(data => {
                    if (data.error || !Array.isArray(data.products)) return;
                    try { localStorage.setItem(LOCAL_CATALOG_KEY, JSON.stringify(data)); } catch (e) {}
                    const freshById = new Map(data.products.map(prod => [prod.id, prod]));
                    allProducts.forEach(prod => {
                        const fresh = freshById.get(prod.id);
                        if (!fresh) return;
                        prod.stock = (typeof fresh.stock === 'number') ? fresh.stock : null;
                        prod.archived = !!fresh.outOfStock;
                    });
                })
                .catch(() => {});
        }, 2200);
"""
          if old in s:
              s = s.replace(old, new, 1)
          elif 'Товары и пользовательские данные стартуют параллельно' not in s:
              raise SystemExit('startup patch failed')

          s = s.replace('/smart-search.js?v=20260817b', '/smart-search.js?v=20260817c')
          old = '    <script src="/smart-search.js?v=20260817c"></script>\n</body>'
          new = '    <script src="/smart-search.js?v=20260817c"></script>\n    <script src="/storefront-enhancements.js?v=20260817a"></script>\n</body>'
          if old in s:
              s = s.replace(old, new, 1)
          elif '/storefront-enhancements.js' not in s:
              raise SystemExit('enhancements include patch failed')
          p.write_text(s, encoding='utf-8')
          PY

      - name: Validate
        shell: bash
        run: |
          node --check smart-search.js
          node --check storefront-enhancements.js
          node --input-type=module --check < api/_catalog-lib.js
          node --input-type=module --check < api/get-data.js
          node --input-type=module --check < api/product-image.js
          git diff --check
          grep -q "imageCount: hasPhoto" api/_catalog-lib.js
          grep -q "storefront-enhancements.js?v=20260817a" index.html
          ! grep -q "categorySearchActive" smart-search.js

      - name: Commit and clean installer
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rm .github/workflows/storefront-polish.yml
          git add index.html smart-search.js api/_catalog-lib.js
          git commit -m 'Finish storefront performance and gallery polish'
          git push origin HEAD:main
