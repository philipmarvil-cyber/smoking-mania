name: Apply sharp image source fix

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/fix-sharp-image-source.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Fix sharp image source and fallback
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          card = Path('card-quality.js')
          s = card.read_text(encoding='utf-8')

          old = '''    function getSharpCardUrl(prod) {
        const source = getFullUrl(prod);
        if (!source) return '';
        return `/_vercel/image?url=${encodeURIComponent(source)}&w=${CARD_IMAGE_WIDTH}&q=${CARD_IMAGE_QUALITY}`;
    }
'''
          new = '''    function getSharpCardUrl(prod) {
        const source = getFullUrl(prod);
        if (!source) return '';
        // Vercel Image Optimization должен получать абсолютный URL источника.
        // Относительный /api/product-image приводил к пустым карточкам.
        const absoluteSource = new URL(source, location.origin).href;
        return `/_vercel/image?url=${encodeURIComponent(absoluteSource)}&w=${CARD_IMAGE_WIDTH}&q=${CARD_IMAGE_QUALITY}`;
    }
'''
          if old not in s:
              raise SystemExit('getSharpCardUrl block not found')
          s = s.replace(old, new, 1)

          old2 = '''        const absolute = new URL(sharpUrl, location.href).href;
        if (img.src !== absolute) img.src = sharpUrl;
        img.dataset.imageQuality = 'sharp';
'''
          new2 = '''        const absolute = new URL(sharpUrl, location.href).href;
        const fullFallback = getFullUrl(prod);
        img.onerror = () => {
            if (img.dataset.fullFallbackTried === '1' || !fullFallback) return;
            img.dataset.fullFallbackTried = '1';
            img.src = fullFallback;
        };
        if (img.src !== absolute) img.src = sharpUrl;
        img.dataset.imageQuality = 'sharp';
'''
          if old2 not in s:
              raise SystemExit('mountSharpImage src block not found')
          s = s.replace(old2, new2, 1)
          card.write_text(s, encoding='utf-8')

          index = Path('index.html')
          b = index.read_bytes()
          oldver = b'/card-quality.js?v=20260911sharp1'
          newver = b'/card-quality.js?v=20260911sharp2'
          if oldver not in b:
              raise SystemExit('sharp1 loader version not found')
          index.write_bytes(b.replace(oldver, newver, 1))
          PY

          node --check card-quality.js
          grep -q 'absoluteSource = new URL(source, location.origin).href' card-quality.js
          grep -q 'fullFallbackTried' card-quality.js
          grep -q '20260911sharp2' index.html

      - name: Commit fix
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rm .github/workflows/fix-sharp-image-source.yml
          git add card-quality.js index.html
          git commit -m 'Fix sharp product image source URL'
          git push origin HEAD:main
