name: Apply image priority patch

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/fix-image-priority.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Apply patch
        run: python .github/scripts/fix_image_priority.py

      - name: Validate JavaScript
        run: |
          node --check card-quality.js
          node --check api/product-image.js
          node --check api/_catalog-lib.js
          grep -q 'MINI_EAGER_COUNT = isMobileWebView ? 8' card-quality.js
          grep -q 'imageStructureChanged' api/_catalog-lib.js
          grep -q 'fetchAndCacheImageLinks' api/product-image.js
          grep -q '20260911instant3' index.html

      - name: Commit patch
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rm .github/workflows/fix-image-priority.yml .github/scripts/fix_image_priority.py
          git add card-quality.js api/_catalog-lib.js api/product-image.js index.html
          git commit -m 'Prioritize instant thumbnails and preserve image cache'
          git push origin HEAD:main
