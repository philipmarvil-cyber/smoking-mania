name: Apply instant image patch

on:
  push:
    branches:
      - main
    paths:
      - '.github/workflows/fix-instant-product-images.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Patch files
        run: |
          python .github/scripts/fix_instant_images.py
          node --check card-quality.js
          grep -q "catalog_cache_v3" index.html
          grep -q "20260911instant2" index.html

      - name: Commit
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rm .github/workflows/fix-instant-product-images.yml
          git rm .github/scripts/fix_instant_images.py
          git add card-quality.js index.html
          git commit -m 'Keep thumbnails visible while sharp images load'
          git push origin HEAD:main
